name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CDK tests
        run: npm ci && npm test
        working-directory: infra

      - name: Control plane tests
        run: pip install -q -r requirements-dev.txt && pytest tests/ -q
        working-directory: control-plane

      - name: Worker tests
        run: pip install -q -r requirements-dev.txt && pytest tests/ -q
        working-directory: worker

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK dependencies
        run: npm ci
        working-directory: infra

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push control-plane image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/loadtest/control-plane:${{ github.sha }} \
                       -t $ECR_REGISTRY/loadtest/control-plane:latest .
          docker push $ECR_REGISTRY/loadtest/control-plane:${{ github.sha }}
          docker push $ECR_REGISTRY/loadtest/control-plane:latest
        working-directory: control-plane

      - name: Build and push worker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/loadtest/worker:${{ github.sha }} \
                       -t $ECR_REGISTRY/loadtest/worker:latest .
          docker push $ECR_REGISTRY/loadtest/worker:${{ github.sha }}
          docker push $ECR_REGISTRY/loadtest/worker:latest
        working-directory: worker

      - name: Build and push grafana image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/loadtest/grafana:${{ github.sha }} \
                       -t $ECR_REGISTRY/loadtest/grafana:latest .
          docker push $ECR_REGISTRY/loadtest/grafana:${{ github.sha }}
          docker push $ECR_REGISTRY/loadtest/grafana:latest
        working-directory: grafana

      - name: Deploy
        run: npx cdk deploy LoadTestStack --context imageTag=${{ github.sha }} --require-approval never
        working-directory: infra
