name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CDK tests
        run: npm ci && npm test
        working-directory: infra

      - name: Control plane tests
        run: pip install -q -r requirements-dev.txt && pytest tests/ -q
        working-directory: control-plane

      - name: Worker tests
        run: pip install -q -r requirements-dev.txt && pytest tests/ -q
        working-directory: worker

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 14400

      - name: Install CDK dependencies
        run: npm ci
        working-directory: infra

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Detect changed paths
        id: changes
        run: |
          # Force rebuild all images if ECR repos are empty (fresh environment)
          has_image=$(aws ecr describe-images --repository-name loadtest/control-plane \
            --region $AWS_REGION --query 'length(imageDetails)' --output text 2>/dev/null || echo "0")
          if [ "$has_image" = "0" ]; then
            echo "control-plane=true" >> $GITHUB_OUTPUT
            echo "worker=true"        >> $GITHUB_OUTPUT
            echo "grafana=true"       >> $GITHUB_OUTPUT
          else
            changed=$(git diff --name-only HEAD~1 HEAD)
            echo "control-plane=$(echo "$changed" | grep -q '^control-plane/' && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "worker=$(echo "$changed"        | grep -q '^worker/'        && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "grafana=$(echo "$changed"       | grep -q '^grafana/'       && echo true || echo false)" >> $GITHUB_OUTPUT
          fi

      - name: Build and push control-plane image
        if: steps.changes.outputs.control-plane == 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/loadtest/control-plane:${{ github.sha }} \
                       -t $ECR_REGISTRY/loadtest/control-plane:latest .
          docker push $ECR_REGISTRY/loadtest/control-plane:${{ github.sha }}
          docker push $ECR_REGISTRY/loadtest/control-plane:latest
        working-directory: control-plane

      - name: Build and push worker image
        if: steps.changes.outputs.worker == 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/loadtest/worker:${{ github.sha }} \
                       -t $ECR_REGISTRY/loadtest/worker:latest .
          docker push $ECR_REGISTRY/loadtest/worker:${{ github.sha }}
          docker push $ECR_REGISTRY/loadtest/worker:latest
        working-directory: worker

      - name: Build and push grafana image
        if: steps.changes.outputs.grafana == 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/loadtest/grafana:${{ github.sha }} \
                       -t $ECR_REGISTRY/loadtest/grafana:latest .
          docker push $ECR_REGISTRY/loadtest/grafana:${{ github.sha }}
          docker push $ECR_REGISTRY/loadtest/grafana:latest
        working-directory: grafana

      # CDK keeps all ECS services at desiredCount=0 so deploys always succeed
      # regardless of whether images exist. The scale-up step below brings them live.
      - name: Deploy stack
        env:
          CP_TAG:      ${{ steps.changes.outputs.control-plane == 'true' && github.sha || 'latest' }}
          WORKER_TAG:  ${{ steps.changes.outputs.worker        == 'true' && github.sha || 'latest' }}
          GRAFANA_TAG: ${{ steps.changes.outputs.grafana       == 'true' && github.sha || 'latest' }}
        run: |
          npx cdk deploy LoadTestStack \
            --context controlPlaneTag=$CP_TAG \
            --context workerTag=$WORKER_TAG \
            --context grafanaTag=$GRAFANA_TAG \
            --require-approval never
        working-directory: infra

      # Scale up control plane and grafana — images are guaranteed to be in ECR at this point.
      # Worker desired count is managed by SQS-based autoscaling, not here.
      - name: Scale up services
        run: |
          CLUSTER=$(aws ecs list-clusters --region $AWS_REGION \
            --query 'clusterArns[?contains(@,`LoadTestStack`)]' --output text \
            | xargs -I{} aws ecs describe-clusters --clusters {} --region $AWS_REGION \
                         --query 'clusters[0].clusterName' --output text)
          CP_SERVICE=$(aws ecs list-services --cluster $CLUSTER --region $AWS_REGION \
            --query 'serviceArns[?contains(@,`ControlPlane`)]' --output text | awk -F/ '{print $NF}')
          GRAFANA_SERVICE=$(aws ecs list-services --cluster $CLUSTER --region $AWS_REGION \
            --query 'serviceArns[?contains(@,`Grafana`)]' --output text | awk -F/ '{print $NF}')
          aws ecs update-service --cluster $CLUSTER --service $CP_SERVICE    --desired-count 1 --region $AWS_REGION > /dev/null
          aws ecs update-service --cluster $CLUSTER --service $GRAFANA_SERVICE --desired-count 1 --region $AWS_REGION > /dev/null
          echo "Scaled up $CP_SERVICE and $GRAFANA_SERVICE to 1"
