name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CDK tests
        run: npm ci && npm test
        working-directory: infra

      - name: Control plane tests
        run: pip install -q -r requirements-dev.txt && pytest tests/ -q
        working-directory: control-plane

      - name: Worker tests
        run: pip install -q -r requirements-dev.txt && pytest tests/ -q
        working-directory: worker

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      control-plane: ${{ steps.filter.outputs.control-plane }}
      worker: ${{ steps.filter.outputs.worker }}
      grafana: ${{ steps.filter.outputs.grafana }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            control-plane:
              - 'control-plane/**'
            worker:
              - 'worker/**'
            grafana:
              - 'grafana/**'
            infra:
              - 'infra/**'

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [test, changes]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      # Authenticate to AWS via OIDC — no access keys stored anywhere
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK dependencies
        run: npm ci
        working-directory: infra

      # Deploy InfraStack first — creates ECR repos and all shared resources
      - name: Deploy InfraStack
        run: npx cdk deploy InfraStack --require-approval never
        working-directory: infra

      # Login to ECR
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Only rebuild images when their source changed
      - name: Build and push control-plane image
        if: needs.changes.outputs.control-plane == 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/loadtest/control-plane:${{ github.sha }} \
                       -t $ECR_REGISTRY/loadtest/control-plane:latest .
          docker push $ECR_REGISTRY/loadtest/control-plane:${{ github.sha }}
          docker push $ECR_REGISTRY/loadtest/control-plane:latest
        working-directory: control-plane

      - name: Build and push worker image
        if: needs.changes.outputs.worker == 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/loadtest/worker:${{ github.sha }} \
                       -t $ECR_REGISTRY/loadtest/worker:latest .
          docker push $ECR_REGISTRY/loadtest/worker:${{ github.sha }}
          docker push $ECR_REGISTRY/loadtest/worker:latest
        working-directory: worker

      - name: Build and push grafana image
        if: needs.changes.outputs.grafana == 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/loadtest/grafana:${{ github.sha }} \
                       -t $ECR_REGISTRY/loadtest/grafana:latest .
          docker push $ECR_REGISTRY/loadtest/grafana:${{ github.sha }}
          docker push $ECR_REGISTRY/loadtest/grafana:latest
        working-directory: grafana

      # Deploy CDK stacks:
      # - Pass imageTag=sha when the image was rebuilt (forces new task def → rolling ECS deploy)
      # - Pass imageTag=latest when image unchanged (CDK sees no diff, skips ECS update unless CDK code changed)
      - name: Deploy application stacks
        env:
          CP_TAG: ${{ needs.changes.outputs.control-plane == 'true' && github.sha || 'latest' }}
          WORKER_TAG: ${{ needs.changes.outputs.worker == 'true' && github.sha || 'latest' }}
          GRAFANA_TAG: ${{ needs.changes.outputs.grafana == 'true' && github.sha || 'latest' }}
        run: |
          npx cdk deploy ControlPlaneStack --context imageTag=$CP_TAG      --require-approval never
          npx cdk deploy WorkerStack       --context imageTag=$WORKER_TAG  --require-approval never
          npx cdk deploy AutoscalingStack  --require-approval never
          npx cdk deploy GrafanaStack      --context imageTag=$GRAFANA_TAG --require-approval never
        working-directory: infra
