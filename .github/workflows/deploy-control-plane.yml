name: Deploy Control Plane

on:
  push:
    branches: [main]
    paths:
      - 'control-plane/**'
      - 'infra/lib/control-plane-stack.ts'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test:
    name: Control Plane Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control-plane/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: control-plane

      - name: Run tests
        run: pytest tests/ -q
        working-directory: control-plane

  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/loadtest/control-plane:${{ github.sha }} \
                       -t $ECR_REGISTRY/loadtest/control-plane:latest .
          docker push $ECR_REGISTRY/loadtest/control-plane:${{ github.sha }}
          docker push $ECR_REGISTRY/loadtest/control-plane:latest
        working-directory: control-plane

      - name: Install CDK dependencies
        run: npm ci
        working-directory: infra

      - name: Deploy ControlPlaneStack
        run: npx cdk deploy ControlPlaneStack --context imageTag=${{ github.sha }} --require-approval never
        working-directory: infra
