name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test-infra:
    name: CDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        run: npm ci
        working-directory: infra

      - name: Run CDK tests
        run: npm test
        working-directory: infra

  test-control-plane:
    name: Control Plane Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control-plane/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: control-plane

      - name: Run tests
        run: pytest tests/ -q
        working-directory: control-plane

  test-worker:
    name: Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: worker

      - name: Run tests
        run: pytest tests/ -q
        working-directory: worker

  build-images:
    name: Docker Build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build control-plane image
        run: docker build -t loadtest/control-plane:ci .
        working-directory: control-plane

      - name: Build worker image
        run: docker build -t loadtest/worker:ci .
        working-directory: worker

      - name: Build grafana image
        run: docker build -t loadtest/grafana:ci .
        working-directory: grafana
